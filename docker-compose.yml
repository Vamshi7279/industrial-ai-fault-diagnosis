version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial_ai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/industrial_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret-jwt-key-production-change-me
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./industrial_plant.db:/app/industrial_plant.db
      - ./models:/app/models
      - ./clips:/app/clips

  postgres:
    image: postgres:16-alpine
    container_name: industrial_ai_postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=industrial_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: industrial_ai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: industrial_ai_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
